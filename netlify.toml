# Netlify configuration for Harmony Homoeopathic Clinic
# Static site — no build step. Files are served from the repo root.

[build]
  publish = "."
  command = ""

# Assets aren't content-hashed, so always revalidate to ensure visitors
# get the latest CSS/JS (Netlify returns fast 304s when unchanged).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sensible security + privacy headers for the HTML pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Pretty URL: allow /reviews to resolve to reviews.html
[[redirects]]
  from = "/reviews"
  to = "/reviews.html"
  status = 200
